# SPDX-License-Identifier: GPL-3.0-or-later
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer + portable exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The plugin hardcodes https://get.videolan.org, which 302-redirects to a
      # pool of third-party mirrors. One of them (mirror.ajl.albony.in) has served
      # an expired TLS cert, and the JVM rejects that with
      # SSLHandshakeException(certificate_expired) - no amount of task retries
      # helps. Seed the archive from VideoLAN's own host instead; the plugin's
      # Download task uses overwrite(false), so it skips its own fetch afterwards.
      - name: Seed libVLC archive
        shell: pwsh
        run: |
          $v = (Select-String -Path 'gradle/libs.versions.toml' -Pattern '^vlc = "([^"]+)"').Matches[0].Groups[1].Value
          $dir = Join-Path $env:USERPROFILE ".gradle\vlcSetup"
          $file = Join-Path $dir "vlc-$v.zip"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if ((Test-Path $file) -and ((Get-Item $file).Length -gt 70MB)) {
            Write-Host "already present: $file"
          } else {
            $src = "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip"
            curl.exe -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 900 -o "$file.part" $src
            if ((Get-Item "$file.part").Length -lt 70MB) { throw "VLC archive truncated" }
            Move-Item "$file.part" $file -Force
          }
          Write-Host "vlc archive: $((Get-Item $file).Length) bytes"

      - name: Build MSI and portable EXE
        run: ./gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe --stacktrace

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android has been unreliable on the ubuntu-24.04
      # runner image, and `sdkmanager` is not guaranteed to be on PATH. This step
      # works either way: use the preinstalled SDK if present, otherwise install
      # the command-line tools ourselves.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$PWD/android-sdk"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER" || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # :androidApp is excluded from settings.gradle.kts unless yt.android=on,
      # so a plain desktop build needs no Android SDK at all.
      - name: Build debug APK
        run: ./gradlew -Pyt.android=on :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: androidApp/build/outputs/apk/debug/*.apk

      # Same code base, `tv` flavour: leanback launcher, 320x180 banner and the
      # D-pad shell. Reuses the SDK + Gradle state set up above, so this is the
      # cheap place to build it rather than a third job.
      - name: Build Android TV release APK
        run: ./gradlew -Pyt.android=on :androidApp:assembleTvRelease --stacktrace

      - name: Upload Android TV release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-release
          if-no-files-found: error
          path: androidApp/build/outputs/apk/tv/release/*.apk