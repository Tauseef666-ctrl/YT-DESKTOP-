# SPDX-License-Identifier: GPL-3.0-or-later
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_tv:
        description: 'Also build the Android TV release APK (reenable only after the Windows + Android phone releases are verified)'
        required: false
        default: false
        type: boolean
      publish_release:
        description: 'Attach the built MSI/EXE/APK to the v* GitHub release (assets upload from a GitHub runner, not this machine)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 0 gate. These tests hit YouTube over the network and decide whether
  # Phase 1 can proceed at all, so they run first and on their own box.
  spikes:
    name: Extraction spikes (S1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # S1 (extraction gate) plus the Phase 1 service layer smoke tests. Both
      # hit YouTube over the network and are kept tiny and explicitly selected.
      - name: S1 + Phase 1 service smoke tests
        run: ./gradlew :core:test --tests '*SpikeTest*' --tests '*Phase1*' --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spike-test-report
          path: core/build/reports/tests/

  windows:
    name: Windows installer + portable exe
    runs-on: windows-latest
    # Job-level so both the "sign" and "warn" steps can read them in `if`.
    env:
      CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The plugin hardcodes https://get.videolan.org, which 302-redirects to a
      # pool of third-party mirrors. One of them (mirror.ajl.albony.in) has served
      # an expired TLS cert, and the JVM rejects that with
      # SSLHandshakeException(certificate_expired) - no amount of task retries
      # helps. Seed the archive from VideoLAN's own host instead; the plugin's
      # Download task uses overwrite(false), so it skips its own fetch afterwards.
      - name: Seed libVLC archive
        shell: pwsh
        run: |
          $v = (Select-String -Path 'gradle/libs.versions.toml' -Pattern '^vlc = "([^"]+)"').Matches[0].Groups[1].Value
          $dir = Join-Path $env:USERPROFILE ".gradle\vlcSetup"
          $file = Join-Path $dir "vlc-$v.zip"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if ((Test-Path $file) -and ((Get-Item $file).Length -gt 70MB)) {
            Write-Host "already present: $file"
          } else {
            $src = "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip"
            curl.exe -fsSL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 900 -o "$file.part" $src
            if ((Get-Item "$file.part").Length -lt 70MB) { throw "VLC archive truncated" }
            Move-Item "$file.part" $file -Force
          }
          Write-Host "vlc archive: $((Get-Item $file).Length) bytes"

      # Spike S3: real libVLC playback (headless). `vlcSetup` re-stages the
      # full plugin set under appResources, then the test plays YouTube's DASH
      # and HLS manifests plus a local mp4+srt. Runs on Windows because that is
      # our packaged target and CI has no WDAC policy (locally one blocks a
      # handful of VLC DLLs with error 4551, poisoning results).
      - name: S3 - libVLC playback spike
        run: ./gradlew.bat :desktopApp:test --tests '*PlaybackSpikeTest*' --stacktrace

      - name: Upload S3 test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: s3-test-report
          path: desktopApp/build/reports/tests/

      - name: Build MSI and portable EXE
        run: ./gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe --stacktrace

      # Smart App Control / SmartScreen (owner: "smart app guard blocks the
      # installer"): unsigned builds are blocked outright by Windows 11 SAC and
      # scare-screen every download otherwise. The only real fix is an
      # Authenticode signature. This step is dormant until the owner supplies a
      # cert as two repo secrets — CODESIGN_PFX_B64 (base64 of the .pfx) and
      # CODESIGN_PASSWORD. signtool.exe ships with the Windows SDK that pads
      # the windows-latest runner image.
      - name: Sign MSI and EXE (when CODESIGN secrets are present)
        if: env.CODESIGN_PFX_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'ytdesktop-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_B64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe `
            | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          $artifacts = @(Get-ChildItem 'desktopApp\build\compose\binaries\main\msi\*.msi') +
            @(Get-ChildItem 'desktopApp\build\compose\binaries\main\exe\*.exe')
          foreach ($a in $artifacts) {
            Write-Host "== signing $($a.Name)"
            & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $a.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($a.Name)" }
            & $signtool.FullName verify /pa /v $a.FullName | Select-Object -First 3
            if ($LASTEXITCODE -ne 0) { throw "signature verify failed on $($a.Name)" }
          }

      - name: Warn when artifacts are unsigned
        if: env.CODESIGN_PFX_B64 == ''
        shell: pwsh
        run: |
          Write-Host "::warning::This build is NOT signed. Windows Smart App Control "`
            "(Windows 11 22H2+) will block it and SmartScreen will warn "`
            "everyone else. Add CODESIGN_PFX_B64 + CODESIGN_PASSWORD repo "`
            "secrets (see SIGNING.md) to sign automatically."

      # The packaged app has never been launched anywhere, so assert it stays
      # alive for a boot window before we call this a release. We deliberately
      # do NOT assert a window handle: the runner's session may not expose one,
      # and S3 already proves actual (headless) decode. A crash is what we
      # want to catch, and a crash is deterministic.
      - name: Boot smoke - packaged EXE stays alive
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'desktopApp/build/compose/binaries/main/exe/*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'no packaged exe found' }
          Write-Host "booting: $($exe.Name)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            throw "packaged app exited during boot smoke (code $($p.ExitCode))"
          }
          $hwnd = $p.MainWindowHandle
          if ($hwnd -eq 0) { Write-Host 'warning: no visible window handle (session has no desktop)' }
          Stop-Process -Id $p.Id -Force
          Write-Host "BOOT SMOKE OK: alive after 15s, window handle=$hwnd"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android has been unreliable on the ubuntu-24.04
      # runner image, and `sdkmanager` is not guaranteed to be on PATH. This step
      # works either way: use the preinstalled SDK if present, otherwise install
      # the command-line tools ourselves.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$PWD/android-sdk"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER" || true
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # :androidApp is excluded from settings.gradle.kts unless yt.android=on,
      # so a plain desktop build needs no Android SDK at all.
      - name: Build debug APK
        run: ./gradlew -Pyt.android=on :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          # Product flavours mean AGP writes to outputs/apk/<flavor>/<buildType>/,
          # so this must be the phone directory, not a bare apk/debug/.
          path: androidApp/build/outputs/apk/phone/debug/*.apk

      # Same code base, `tv` flavour: leanback launcher, 320x180 banner and the
      # D-pad shell. Kept OUT of the normal pipeline: the Android TV release is
      # gated behind a manual `workflow_dispatch` with build_tv=true so it only
      # ships after the Windows + Android phone releases are verified (owner's
      # order). Note: `github.event.inputs.*` is empty on push/PR, so this step
      # is skipped there.
      - name: Build Android TV release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_tv == 'true'
        run: ./gradlew -Pyt.android=on :androidApp:assembleTvRelease --stacktrace

      - name: Upload Android TV release APK
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_tv == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-release
          if-no-files-found: error
          path: androidApp/build/outputs/apk/tv/release/*.apk

  # Owner-triggered with publish_release=true: attach the CI-built installers
  # to the v* release. Assets are uploaded from GitHub's own runners because
  # the owner's local network cannot stream large uploads to uploads.github.com
  # (it drops them mid-body with schannel timeouts / connection aborts), while
  # downloads work fine.
  publish:
    name: Publish release assets
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Upload MSI/EXE/APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^yt\.version=//p' gradle.properties)"
          TAG="v$VERSION"
          echo "release tag: $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "YT Desktop $VERSION" \
              --notes "CI-built installers. Windows MSI/EXE carry every Phase 1 feature; the Android APK is the installable phone shell."
          fi
          for f in $(find dist -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.apk' \)); do
            echo "== uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done
          echo "== assets now attached:"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'