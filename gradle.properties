org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# Required as soon as any androidx.* artifact is on an Android runtime classpath
# (:androidApp:checkDebugAarMetadata fails without it). Harmless when android=off.
android.useAndroidX=true

# Project coordinates
yt.version=0.1.1

# Set to "on" to include the :androidApp module (requires the Android SDK).
# Off by default so desktop-only builds need no Android SDK at all.
yt.android=off
